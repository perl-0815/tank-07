  <radialGradient id="glass"><stop stop-color="#0d2227"/><stop offset=".72" stop-color="#07171d"/><stop offset="1" stop-color="#020a10"/></radialGradient>
  <radialGradient id="vignette"><stop offset=".46" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".74"/></radialGradient>
  <radialGradient id="lamp"><stop stop-color="#ba5c4f" stop-opacity=".25"/><stop offset="1" stop-color="#a43930" stop-opacity="0"/></radialGradient>
