  <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#142b2e"/><stop offset="1" stop-color="#030b10"/></linearGradient>
  <linearGradient id="steel" x2="1" y2=".4"><stop stop-color="#112226"/><stop offset=".48" stop-color="#294047"/><stop offset=".53" stop-color="#172c32"/><stop offset="1" stop-color="#0b171d"/></linearGradient>
