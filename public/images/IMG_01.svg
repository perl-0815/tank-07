<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" role="img" aria-labelledby="title description">
<title id="title">第4研究区画</title><desc id="description">濡れた金属の床が奥の閉鎖扉へ続く、狭い第4研究区画。人影はない。</desc>
